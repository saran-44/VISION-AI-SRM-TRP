# Google Cloud Build pipeline for the SRM TRP Transport backend.
# Complete docs/DEPLOY_WINDOWS.md first: it creates the dedicated build and
# runtime identities, secrets, Direct VPC egress and Cloud NAT. In particular,
# Atlas must allow the NAT address before the first deployment can start.
#
#   gcloud builds submit --config deploy/cloudbuild.yaml .
#
# Builds invoked by a trigger use the identity configured on the trigger,
# rather than this serviceAccount; configure that identity separately.

serviceAccount: projects/$PROJECT_ID/serviceAccounts/srm-trp-build@$PROJECT_ID.iam.gserviceaccount.com

substitutions:
  _REGION: asia-south1
  _REPOSITORY: srm-trp
  _SERVICE: srm-trp-transport

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# BUILD_ID is available for both manual submissions and triggered builds.
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --cpu
      - "1"
      - --memory
      - 2Gi
      - --timeout
      - "300"
      - --min-instances
      - "0"
      - --max-instances
      - "4"
      - --service-account
      - srm-trp-run@$PROJECT_ID.iam.gserviceaccount.com
      - --network
      - srm-trp-vpc
      - --subnet
      - srm-trp-subnet
      - --vpc-egress
      - all-traffic
      - --startup-probe
      - httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=10,failureThreshold=24
      - --set-env-vars
      # Use a custom delimiter so the provider list keeps its comma.
      - ^|^ENVIRONMENT=production|MONGO_DB_NAME=srmtrpai|APP_TIMEZONE=Asia/Kolkata|FIREBASE_PROJECT_ID=$PROJECT_ID|FIREBASE_AUTH_DOMAIN=$PROJECT_ID.firebaseapp.com|FIREBASE_STORAGE_BUCKET=srmtrpai.firebasestorage.app|FIREBASE_MESSAGING_SENDER_ID=734375891811|FIREBASE_APP_ID=1:734375891811:web:6851938bef332bc0e53956|FIREBASE_MEASUREMENT_ID=G-7MXBNH3N7D|FIREBASE_ALLOWED_PROVIDERS=password,google.com|FIREBASE_AUTO_PROVISION=false|LEGACY_PASSWORD_LOGIN_ENABLED=false
      - --set-secrets
      - MONGO_URI=mongo-uri:latest,JWT_SECRET=jwt-secret:latest,DEVICE_API_KEYS=device-keys:latest,FIREBASE_API_KEY=firebase-api-key:latest
