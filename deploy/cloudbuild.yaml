# Google Cloud Build pipeline for the SRM TRP Transport backend.
# Complete docs/DEPLOY_WINDOWS.md first: it creates the dedicated build and
# runtime identities, secrets, Direct VPC egress and Cloud NAT. If Supabase
# network restrictions are enabled, allow the NAT address before deployment.
#
#   gcloud builds submit --config deploy/cloudbuild.yaml .
#
# Builds invoked by a trigger use the identity configured on the trigger,
# rather than this serviceAccount; configure that identity separately.

serviceAccount: projects/$PROJECT_ID/serviceAccounts/srm-trp-build@$PROJECT_ID.iam.gserviceaccount.com

substitutions:
  _REGION: asia-south1
  _REPOSITORY: srm-trp
  _SERVICE: srm-trp-transport

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# BUILD_ID is available for both manual submissions and triggered builds.
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --cpu
      - "1"
      - --memory
      - 2Gi
      - --timeout
      - "300"
      - --min-instances
      - "0"
      - --max-instances
      - "4"
      - --service-account
      - srm-trp-run@$PROJECT_ID.iam.gserviceaccount.com
      - --network
      - srm-trp-vpc
      - --subnet
      - srm-trp-subnet
      - --vpc-egress
      - all-traffic
      - --startup-probe
      - httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=10,failureThreshold=24
      - --set-env-vars
      # Use a custom delimiter so the provider list keeps its comma.
      - ^|^ENVIRONMENT=production|PGSSLROOTCERT=/secrets/supabase-ca.crt|TRUSTED_PROXY_COUNT=0|APP_TIMEZONE=Asia/Kolkata|FIREBASE_PROJECT_ID=$PROJECT_ID|FIREBASE_AUTH_DOMAIN=$PROJECT_ID.firebaseapp.com|FIREBASE_STORAGE_BUCKET=vision-ai-srmtrp.firebasestorage.app|FIREBASE_MESSAGING_SENDER_ID=235811571442|FIREBASE_APP_ID=1:235811571442:web:342e488e0ac2ee75b0f26b|FIREBASE_MEASUREMENT_ID=G-S4HS9TGV4H|FIREBASE_ALLOWED_PROVIDERS=password,google.com|FIREBASE_AUTO_PROVISION=false|LEGACY_PASSWORD_LOGIN_ENABLED=false
      - --set-secrets
      - DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,DEVICE_API_KEYS=device-keys:latest,FIREBASE_API_KEY=firebase-api-key:latest,/secrets/supabase-ca.crt=supabase-ca:latest
