name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        env:
          MONGO_URI: mongomock://transport
          JWT_SECRET: ci-only-secret-value-not-used-by-tests
        run: python -m pytest

      - name: Byte-compile all backend modules
        run: python -m compileall -q backend

      - name: The access-list CLI must be runnable
        env:
          MONGO_URI: mongomock://cli
          JWT_SECRET: ci-only-secret-value-not-used-by-tests
        run: |
          python -m backend.manage_access add ci.user@example.invalid
          python -m backend.manage_access list

  vision:
    name: Vision stack (optional)
    runs-on: ubuntu-latest
    # The detector is an optional extra: the core app must work without it.
    # This job proves the pinned extras still install and that best.pt loads.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the vision extras (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-vision.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: The checkpoint must load and report its classes
        run: |
          python - <<'PY'
          from backend.vision import load_model, vision_status
          status = vision_status()
          assert status["model_present"], "best.pt is missing"
          assert status["available"], f"vision stack unavailable: {status['problems']}"
          model = load_model()
          assert model.names == {0: "red circle", 1: "sticker"}, model.names
          print("model OK:", model.names)
          print("ocr engine:", status["ocr_available"])
          PY

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check all ES modules
        run: |
          set -e
          for file in frontend/js/*.js; do
            node --check "$file"
          done

      - name: Check imports, assets and element references
        run: node scripts/check_frontend.mjs

      - name: Check the Firebase sign-out flow
        run: node scripts/check_auth_flow.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail if credentials are committed
        run: python scripts/scan_secrets.py
