name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: transport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transport_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/transport_test
      ALLOW_TEST_DATABASE_RESET: "true"
      JWT_SECRET: ci-only-secret-value-not-used-by-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Byte-compile all backend modules
        run: python -m compileall -q backend

      - name: The access-list CLI persists across processes
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/transport_test
        run: |
          python -m backend.manage_access add ci.user@example.invalid
          python -m backend.manage_access list | grep ci.user@example.invalid

  vision:
    name: Vision stack (optional)
    runs-on: ubuntu-latest
    # The detector is an optional extra: the core app must work without it.
    # This job proves the pinned extras still install and that best.pt loads.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install torch CPU
        run: |
          pip install torch==2.9.1 torchvision==0.24.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install requirements-vision
        run: pip install -r backend/requirements-vision.txt

      - name: Deduplicate OpenCV
        run: |
          python -m pip uninstall -y opencv-python || true
          python -m pip install --no-deps opencv-python-headless==4.10.0.84

      - name: Check environment
        run: |
          python scripts/check_env.py || (python -c "import torch; print('CUDA:', torch.version.cuda); from importlib import metadata; print('OpenCV:', [d.metadata['Name'] for d in metadata.distributions() if 'opencv' in d.metadata.get('Name','').lower()])"; exit 1)

      - name: The checkpoint must load and report its classes
        run: |
          python - <<'PY'
          from backend.vision import load_model, vision_status
          status = vision_status()
          assert status["model_present"], "best.pt is missing"
          assert status["available"], f"vision stack unavailable: {status['problems']}"
          model = load_model()
          assert model.names == {0: "red circle", 1: "sticker"}, model.names
          print("model OK:", model.names)
          print("ocr engine:", status["ocr_available"])
          PY

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check all ES modules
        run: |
          set -e
          for file in frontend/js/*.js; do
            node --check "$file"
          done

      - name: Check imports, assets and element references
        run: node scripts/check_frontend.mjs

      - name: Check the Firebase sign-out flow
        run: node scripts/check_auth_flow.mjs

      - name: Check lazy Firebase SDK loading
        run: node scripts/check_firebase_loader.mjs

      - name: Check the live stream reconnects instead of falling back to polling
        run: node scripts/check_live_stream.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail if credentials are committed
        run: python scripts/scan_secrets.py

  windows-gate:
    name: Windows gate bundle (untested)
    runs-on: windows-latest
    continue-on-error: true
    # This is intentionally marked untested until a successful hosted run exists.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build portable one-dir bundle
        shell: pwsh
        run: .\desktop\gate\build_gate.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: visionai-gate-dist
          path: dist/
